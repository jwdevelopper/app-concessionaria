<div class="container">
  <div class="d-flex justify-content-end mb-3">
    <button pButton severity="success" [routerLink]="['/clientes/cadastrar']">
      Novo cliente
    </button>
  </div>
  <p-table [value]="listaClientes">
    <ng-template #header>
      <tr>
        <th>Id</th>
        <th>Nome</th>
        <th>CPF/CNPJ</th>
        <th>Ações</th>
      </tr>
    </ng-template>
    <ng-template #body let-cliente>
      <tr>
        <td>{{ cliente.id }}</td>
        <td>{{ cliente.nome }}</td>
        <td>{{ cliente.cpfCnpj }}</td>
        <td>
          <div class="d-flex gap-2">
            <button pButton class="btn-acao" severity="info" iconOnly [routerLink]="['/clientes/editar', cliente.id]"
              pTooltip="Editar" tooltipPosition="top" aria-label="Editar">
              <svg data-p-icon="pencil"></svg>
            </button>
            <button pButton class="btn-acao" severity="danger" iconOnly (click)="excluirCliente(cliente.id)"
              pTooltip="Excluir" tooltipPosition="top" aria-label="Excluir">
              <svg data-p-icon="trash"></svg>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
